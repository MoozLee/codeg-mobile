name = "codeg-relay"
main = "src/index.ts"
# Latest compatibility date the bundled @cloudflare/vitest-pool-workers
# miniflare supports. Deploys use whatever date is available in the
# Cloudflare runtime at deploy time, so bumping this later is safe.
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelaySession"

[[migrations]]
tag = "v1"
new_classes = ["RelaySession"]
